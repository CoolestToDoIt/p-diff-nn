[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p-diff-nn"
version = "0.1.0"
description = "MNIST neural parameter diffusion research prototype"
requires-python = ">=3.11"
dependencies = ["torch>=2.5", "torchvision>=0.20", "PyYAML>=6", "matplotlib>=3.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
